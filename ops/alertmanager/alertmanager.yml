global:
  resolve_timeout: 5m

route:
  receiver: chimap-operator
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: chimap-operator
      matchers:
        - severity = "critical"
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 30m
    - receiver: chimap-operator
      matchers:
        - severity = "warning"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

receivers:
  - name: chimap-operator
    webhook_configs:
      - url: http://alert-relay:9080/alerts
        send_resolved: true
        max_alerts: 10
        timeout: 10s

inhibit_rules:
  - source_matchers:
      - alertname = "ChimapApiMetricsDown"
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal:
      - service
      - environment
