global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: chimap
    environment: production

rule_files:
  - /etc/prometheus/chimap-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: chimap-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:9091

  - job_name: chimap-alert-relay
    metrics_path: /metrics
    static_configs:
      - targets:
          - alert-relay:9080

  - job_name: alertmanager
    metrics_path: /metrics
    static_configs:
      - targets:
          - alertmanager:9093
